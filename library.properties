sentence=Recorded 4-bit IMA ADPCM streaming audio for Arduboy FX.
paragraph=Reads caller-owned ADPCM streams from the FX cart through a 128-byte SRAM ring, decoded by an 8 kHz Timer3 ISR into a 187.5 kHz Timer4 PWM carrier. No heap, no float, no live synthesizer. Includes a deterministic WAV-to-ADPCM/FX encoder.
